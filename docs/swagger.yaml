definitions:
  admin_audit.PageResponse:
    properties:
      records:
        items:
          $ref: '#/definitions/admin_audit.RecordResponse'
        type: array
      total:
        type: integer
    type: object
  admin_audit.RecordResponse:
    properties:
      action:
        type: string
      actor:
        type: string
      created_at:
        type: string
      details:
        type: object
      id:
        type: string
      key_id:
        type: string
      role_id:
        type: string
      service:
        type: string
      service_client_id:
        type: string
      source:
        type: string
    type: object
  audit.SigningPageResponse:
    properties:
      records:
        items:
          $ref: '#/definitions/audit.SigningRecordResponse'
        type: array
      total:
        type: integer
    type: object
  audit.SigningRecordResponse:
    properties:
      created_at:
        type: string
      error_code:
        type: string
      id:
        type: string
      key_id:
        type: string
      network:
        type: string
      raw_tx:
        description: unsigned tx as received, hex with 0x
        type: string
      service:
        type: string
      service_client_id:
        type: string
      tx_hash:
        type: string
    type: object
  httputil.ErrorBody:
    properties:
      code:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
      message:
        type: string
    type: object
  httputil.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/httputil.ErrorBody'
      success:
        example: false
        type: boolean
    type: object
  httputil.Response:
    properties:
      data: {}
      error:
        $ref: '#/definitions/httputil.ErrorBody'
      success:
        type: boolean
    type: object
  key_storage.AcquireLeaseRequest:
    properties:
      exclude:
        items:
          type: string
        type: array
      label:
        type: string
      network:
        type: string
      owner:
        maxLength: 128
        type: string
      ttl_seconds:
        minimum: 30
        type: integer
    required:
    - network
    type: object
  key_storage.CreateRoleKeyRequest:
    properties:
      alias:
        type: string
      external_ref:
        description: only for deposit role
        type: string
    type: object
  key_storage.CreateRoleRequest:
    properties:
      kind:
        enum:
        - single
        - pool
        - deposit
        type: string
      label:
        type: string
      network:
        type: string
      policy:
        type: object
      purpose:
        type: string
      service:
        type: string
    required:
    - kind
    - network
    - purpose
    - service
    type: object
  key_storage.ExtendLeaseRequest:
    properties:
      ttl_seconds:
        minimum: 30
        type: integer
    type: object
  key_storage.ExtendLeaseResponse:
    properties:
      expires_at:
        type: string
    type: object
  key_storage.GetDepositKeyRequest:
    properties:
      alias:
        maxLength: 128
        type: string
      external_ref:
        maxLength: 128
        type: string
      label:
        type: string
      network:
        type: string
    required:
    - external_ref
    - network
    type: object
  key_storage.ImportKeyRequest:
    properties:
      alias:
        type: string
      external_ref:
        description: only for deposit role
        type: string
      private_key:
        description: hex, with or without 0x
        type: string
    required:
    - private_key
    type: object
  key_storage.KeyDetailsResponse:
    properties:
      address:
        type: string
      alias:
        type: string
      created_at:
        type: string
      external_ref:
        type: string
      id:
        type: string
      kek_version:
        type: integer
      kind:
        type: string
      label:
        type: string
      lease_active:
        type: boolean
      lease_id:
        type: string
      lease_owner:
        type: string
      leased_until:
        type: string
      network:
        type: string
      policy:
        description: of role
        type: object
      purpose:
        type: string
      replaced_by:
        type: string
      revoked_at:
        type: string
      rotated_at:
        type: string
      service:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  key_storage.KeyResponse:
    properties:
      address:
        type: string
      alias:
        type: string
      created_at:
        type: string
      external_ref:
        type: string
      id:
        type: string
      kind:
        type: string
      label:
        type: string
      lease_owner:
        type: string
      leased_until:
        type: string
      network:
        type: string
      purpose:
        type: string
      replaced_by:
        type: string
      service:
        type: string
      status:
        type: string
    type: object
  key_storage.KeysPageResponse:
    properties:
      keys:
        items:
          $ref: '#/definitions/key_storage.KeyResponse'
        type: array
      total:
        type: integer
    type: object
  key_storage.LeaseResponse:
    properties:
      expires_at:
        type: string
      key:
        $ref: '#/definitions/key_storage.KeyResponse'
      lease_id:
        type: string
    type: object
  key_storage.RoleDetailsResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      key_counts:
        additionalProperties:
          type: integer
        description: by key status, every status present
        type: object
      kind:
        type: string
      label:
        type: string
      network:
        type: string
      policy:
        type: object
      purpose:
        type: string
      service:
        type: string
    type: object
  key_storage.RoleResponse:
    properties:
      created_at:
        type: string
      id:
        type: string
      kind:
        type: string
      label:
        type: string
      network:
        type: string
      policy:
        type: object
      purpose:
        type: string
      service:
        type: string
    type: object
  key_storage.UpdatePolicyRequest:
    properties:
      policy:
        type: object
    required:
    - policy
    type: object
  service_client.ClientResponse:
    properties:
      created_at:
        type: string
      expires_at:
        type: string
      id:
        type: string
      replaced_by:
        type: string
      revoked_at:
        type: string
      service:
        type: string
      state:
        type: string
    type: object
  service_client.CreateClientRequest:
    properties:
      service:
        type: string
    required:
    - service
    type: object
  service_client.IssuedKeyResponse:
    properties:
      client:
        $ref: '#/definitions/service_client.ClientResponse'
      old_client:
        $ref: '#/definitions/service_client.ClientResponse'
      service_key:
        type: string
    type: object
  service_client.RotateClientRequest:
    properties:
      grace_seconds:
        description: default 24h, 0 rejects old key at once
        minimum: 0
        type: integer
      service:
        type: string
    required:
    - service
    type: object
  signing.SignTransactionRequest:
    properties:
      lease_id:
        description: required for active single and pool keys
        type: string
      network:
        type: string
      raw_tx:
        description: 'hex of unsigned tx: ethereum - types.Transaction.MarshalBinary,
          tron - raw_data_hex'
        type: string
    required:
    - network
    - raw_tx
    type: object
  signing.SignTransactionResponse:
    properties:
      signed_tx:
        description: 'hex: ethereum - eth_sendRawTransaction, tron - /wallet/broadcasthex'
        type: string
      tx_hash:
        type: string
    type: object
info:
  contact: {}
  description: Wallet key storage and transaction signing.
  title: Wallet Service API
  version: "1.0"
paths:
  /api/v1/admin/audit:
    get:
      description: Newest first, empty parameters are not applied.
      parameters:
      - description: Key id
        in: query
        name: key_id
        type: string
      - description: Service of caller
        in: query
        name: service
        type: string
      - description: Hash of signed tx
        in: query
        name: tx_hash
        type: string
      - description: Error code of response, e.g. POLICY_VIOLATION
        in: query
        name: error_code
        type: string
      - description: true - only denied or failed, false - only signed
        in: query
        name: failed
        type: boolean
      - description: Created at or after, RFC3339
        in: query
        name: from
        type: string
      - description: Created before, RFC3339
        in: query
        name: to
        type: string
      - description: Records to skip, default 0
        in: query
        name: offset
        type: integer
      - description: Max records, default 100, max 1000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/audit.SigningPageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: 'Signing audit: every sign-transaction request, signed or denied'
      tags:
      - admin
  /api/v1/admin/audit/actions:
    get:
      description: Newest first, empty parameters are not applied. key_id also matches
        rotation records where key is replacement or replaced key.
      parameters:
      - description: Admin
        in: query
        name: actor
        type: string
      - description: Action, e.g. key.revoke, role.policy_update
        in: query
        name: action
        type: string
      - description: Service of changed object
        in: query
        name: service
        type: string
      - description: Role id
        in: query
        name: role_id
        type: string
      - description: Key id
        in: query
        name: key_id
        type: string
      - description: Service client id
        in: query
        name: service_client_id
        type: string
      - description: Created at or after, RFC3339
        in: query
        name: from
        type: string
      - description: Created before, RFC3339
        in: query
        name: to
        type: string
      - description: Records to skip, default 0
        in: query
        name: offset
        type: integer
      - description: Max records, default 100, max 1000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/admin_audit.PageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: 'Admin audit: who changed roles, policies, keys and service keys'
      tags:
      - admin
  /api/v1/admin/keys:
    get:
      description: Newest first, every filter applies only if parameter is present,
        so ?label= selects keys with empty label.
      parameters:
      - description: Service name
        in: query
        name: service
        type: string
      - description: Role purpose
        in: query
        name: purpose
        type: string
      - description: Purpose refinement
        in: query
        name: label
        type: string
      - description: 'Network: ethereum, tron, arbitrum'
        in: query
        name: network
        type: string
      - description: Key status
        enum:
        - active
        - rotating
        - pending
        - disabled
        - revoked
        in: query
        name: status
        type: string
      - description: Order id of deposit key
        in: query
        name: external_ref
        type: string
      - description: Key address, case-insensitive
        in: query
        name: address
        type: string
      - description: true - under live lease, false - free
        in: query
        name: leased
        type: boolean
      - description: Keys to skip, default 0
        in: query
        name: offset
        type: integer
      - description: Max keys, default 100, max 1000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeysPageResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: List keys of all services
      tags:
      - admin
  /api/v1/admin/keys/{id}:
    get:
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyDetailsResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: 'Key card: key of any service with lease, KEK version, timestamps and
        policy of role'
      tags:
      - admin
  /api/v1/admin/keys/{id}/activate:
    post:
      parameters:
      - description: Pending key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Activate pending key, key replaced by it becomes rotating
      tags:
      - admin
  /api/v1/admin/keys/{id}/disable:
    post:
      parameters:
      - description: Active key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Disable active key until enable
      tags:
      - admin
  /api/v1/admin/keys/{id}/enable:
    post:
      parameters:
      - description: Disabled key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Enable disabled key
      tags:
      - admin
  /api/v1/admin/keys/{id}/release-lease:
    post:
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Force release lease of key held by stuck instance
      tags:
      - admin
  /api/v1/admin/keys/{id}/revoke:
    post:
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Revoke key forever, revoking pending key cancels rotation
      tags:
      - admin
  /api/v1/admin/keys/{id}/rotate:
    post:
      description: Old key keeps working and may send its funds to replacement. Switch
        keys with activate.
      parameters:
      - description: Active key id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: Replacement key
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: 'Start rotation: create pending replacement of active key'
      tags:
      - admin
  /api/v1/admin/roles:
    get:
      parameters:
      - description: Service name, all services when empty
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/key_storage.RoleResponse'
                  type: array
              type: object
      summary: List wallet roles
      tags:
      - admin
    post:
      consumes:
      - application/json
      parameters:
      - description: Role params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/key_storage.CreateRoleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.RoleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Create wallet role of service
      tags:
      - admin
  /api/v1/admin/roles/{id}:
    get:
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.RoleDetailsResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: 'Role card: role with policy and number of keys by status'
      tags:
      - admin
  /api/v1/admin/roles/{id}/keys:
    get:
      description: Newest first.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      - description: Keys to skip, default 0
        in: query
        name: offset
        type: integer
      - description: Max keys, default 100, max 1000
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeysPageResponse'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: List keys of role
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Single role has one active key, deposit role key requires external_ref.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      - description: Key params
        in: body
        name: request
        schema:
          $ref: '#/definitions/key_storage.CreateRoleKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Generate new key of role
      tags:
      - admin
  /api/v1/admin/roles/{id}/keys/import:
    post:
      consumes:
      - application/json
      description: 'For keys moved from service env. Private key travels in request
        body: use only over TLS without body logging.'
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      - description: Private key
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/key_storage.ImportKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Import existing private key into role
      tags:
      - admin
  /api/v1/admin/roles/{id}/policy:
    put:
      consumes:
      - application/json
      description: Applies to all keys of role. Format is described in docs/POLICY.md.
        Empty rules deny signing.
      parameters:
      - description: Role id
        in: path
        name: id
        required: true
        type: string
      - description: Policy
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/key_storage.UpdatePolicyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.RoleResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Replace signing policy of role
      tags:
      - admin
  /api/v1/admin/service-clients:
    get:
      parameters:
      - description: Service name, all services when empty
        in: query
        name: service
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/service_client.ClientResponse'
                  type: array
              type: object
      summary: List service keys without hashes
      tags:
      - admin
    post:
      consumes:
      - application/json
      description: Key is shown once, only its hash is stored. Service with active
        key must be rotated instead.
      parameters:
      - description: Service
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service_client.CreateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/service_client.IssuedKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Register service and issue its X-Service-Key
      tags:
      - admin
  /api/v1/admin/service-clients/{id}/revoke:
    post:
      parameters:
      - description: Service client id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Reject service key at once
      tags:
      - admin
  /api/v1/admin/service-clients/rotate:
    post:
      consumes:
      - application/json
      parameters:
      - description: Service and grace period
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/service_client.RotateClientRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/service_client.IssuedKeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      summary: Issue new X-Service-Key, old one is accepted for grace period
      tags:
      - admin
  /api/v1/keys/{id}/sign-transaction:
    post:
      consumes:
      - application/json
      description: Signs unsigned tx with own key. Tx is built and sent by the caller.
      parameters:
      - description: Key id
        in: path
        name: id
        required: true
        type: string
      - description: Unsigned tx
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/signing.SignTransactionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/signing.SignTransactionResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Sign transaction
      tags:
      - signing
  /api/v1/leases/{id}:
    delete:
      parameters:
      - description: Lease id
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httputil.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Release own lease
      tags:
      - keys
  /api/v1/leases/{id}/extend:
    post:
      consumes:
      - application/json
      parameters:
      - description: Lease id
        in: path
        name: id
        required: true
        type: string
      - description: TTL
        in: body
        name: request
        schema:
          $ref: '#/definitions/key_storage.ExtendLeaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.ExtendLeaseResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Extend own lease
      tags:
      - keys
  /api/v1/roles/{purpose}/deposit-key:
    post:
      consumes:
      - application/json
      description: Returns key bound to external_ref (e.g. order id). Key is created
        on first call, repeated calls return the same key.
      parameters:
      - description: Role purpose, e.g. deposit
        in: path
        name: purpose
        required: true
        type: string
      - description: Deposit key params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/key_storage.GetDepositKeyRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Get or create deposit key of own deposit role
      tags:
      - keys
  /api/v1/roles/{purpose}/key:
    get:
      description: Returns current key of role, e.g. gas station. Key changes after
        rotation, so do not store key id in config.
      parameters:
      - description: Role purpose, e.g. gas_station
        in: path
        name: purpose
        required: true
        type: string
      - description: Purpose refinement, e.g. atoken, usdt_high_risk
        in: query
        name: label
        type: string
      - description: 'Network: ethereum, tron, arbitrum'
        in: query
        name: network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.KeyResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Get active key of own single role
      tags:
      - keys
  /api/v1/roles/{purpose}/keys:
    get:
      description: Returns all keys of single or pool role with statuses, e.g. executors.
        Sign only with active keys, rotating keys finish sent txs.
      parameters:
      - description: Role purpose, e.g. executor
        in: path
        name: purpose
        required: true
        type: string
      - description: Purpose refinement
        in: query
        name: label
        type: string
      - description: 'Network: ethereum, tron, arbitrum'
        in: query
        name: network
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/key_storage.KeyResponse'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: List keys of own role
      tags:
      - keys
  /api/v1/roles/{purpose}/lease:
    post:
      consumes:
      - application/json
      description: Key is used exclusively by caller until lease expires or is released.
        Pool keys sign only with lease.
      parameters:
      - description: Role purpose, e.g. executor
        in: path
        name: purpose
        required: true
        type: string
      - description: Lease params
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/key_storage.AcquireLeaseRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/httputil.Response'
            - properties:
                data:
                  $ref: '#/definitions/key_storage.LeaseResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
        "409":
          description: NO_FREE_KEY, retry after Retry-After seconds
          schema:
            $ref: '#/definitions/httputil.ErrorResponse'
      security:
      - ServiceKey: []
      summary: Lease free key of own role
      tags:
      - keys
securityDefinitions:
  ServiceKey:
    in: header
    name: X-Service-Key
    type: apiKey
swagger: "2.0"
